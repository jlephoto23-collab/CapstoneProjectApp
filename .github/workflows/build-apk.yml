name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create minimal Android WebView project
        run: |
          mkdir -p android-project/app/src/main/java/com/eduflow/capstone
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets/www
          mkdir -p android-project/gradle/wrapper
          cp -r web/* android-project/app/src/main/assets/www/

          cat > android-project/settings.gradle << 'G'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "EduFlow"
          include ':app'
          G

          cat > android-project/build.gradle << 'G'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
          }
          G

          cat > android-project/gradle.properties << 'G'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          G

          cat > android-project/app/build.gradle << 'G'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.eduflow.capstone'
            compileSdk 34
            defaultConfig {
              applicationId "com.eduflow.capstone"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.10.0'
          }
          G

          cat > android-project/app/src/main/AndroidManifest.xml << 'G'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:allowBackup="true"
              android:label="EduFlow"
              android:supportsRtl="true"
              android:usesCleartextTraffic="true"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          G

          cat > android-project/app/src/main/java/com/eduflow/capstone/MainActivity.java << 'G'
          package com.eduflow.capstone;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/www/index.html");
            }
          }
          G

          cat > android-project/app/src/main/res/values/strings.xml << 'G'
          <resources><string name="app_name">EduFlow</string></resources>
          G

      - name: Setup Gradle Wrapper
        working-directory: android-project
        run: |
          curl -sL -o gradle-8.2-bin.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduFlow-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
